appId: top.z-tools
productName: ZTools
publish:
  provider: github
  owner: ZToolsCenter
  repo: ZTools
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.DS_Store'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml}'
  - '!{CHANGELOG.md,changelog.md,README.md,README_EN.md,CONTRIBUTING.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,.gitmodules,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo,vitest.config.*}'
  - '!{.claude/**,.githooks/**,.github/**}'
  - '!AGENTS.md'
  - '!docs/**'
  - '!tests/**'
  - '!updater/**'
  - '!ztools-api-types/**'
  - '!ztools-plugin-cli/**'
  - '!scripts/**'
  - '!internal-plugins/**'
  - '!**/*.map'
  - '!**/node_modules/**/*.{d.ts,d.cts,d.mts}'
  - '!**/node_modules/openai/src/**'
  - '!**/node_modules/@mixmark-io/domino/.yarn/**'
  - '!**/node_modules/lmdb/{dependencies,src}/**'
  - '!**/node_modules/uiohook-napi/{libuiohook,src}/**'
asarUnpack:
  - resources/**
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
fileAssociations:
  - ext: zpx
    name: ZTools Plugin
    description: ZTools Plugin Package
    role: Viewer
win:
  compression: maximum
  executableName: ZTools
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-${os}-${arch}-setup.${ext}
  include: build/installer.nsh
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  compression: maximum
  # The Developer ID identity is selected by CSC_NAME in CI. Leaving this
  # unset keeps local builds compatible with machines that have no certificate.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
dmg:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: ZToolsCenter
  category: Utility
  # 固定可执行文件名，同时固定生成的 ztools.desktop 名称（package.json 的 desktopName 需一致）
  executableName: ztools
  icon: build/icons
  synopsis: 高效可扩展的应用启动器与插件平台
  description: ZTools 是一个高性能、可扩展的应用启动器与插件平台，支持拼音搜索、插件系统、剪贴板管理与主题定制。
  desktop:
    entry:
      StartupWMClass: ZTools
      StartupNotify: 'true'
deb:
  # 托盘图标依赖 StatusNotifier/AppIndicator 宿主，GNOME 上由扩展提供
  depends:
    - libayatana-appindicator3-1
    - libnotify4
    - libxtst6
    - libnss3
appImage:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
npmRebuild: false

afterPack: ./build/afterPack.js
